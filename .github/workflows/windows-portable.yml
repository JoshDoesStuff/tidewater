# Builds the portable Windows zip (tool/release/build_portable.ps1) on a Windows runner.
# Every run uploads the Tidewater-portable artifact; a v* tag also attaches Tidewater-portable.zip to a Release:
#   curl -LO https://github.com/JoshDoesStuff/tidewater/releases/latest/download/Tidewater-portable.zip
name: Windows portable

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  portable:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Rust (smtc_windows)
        run: rustup toolchain install stable --profile minimal
      - name: Build portable folder
        run: ./tool/release/build_portable.ps1
      - name: Check contents
        run: |
          Get-ChildItem dist/Tidewater | Format-Table Name, Length
          $need = 'tidewater.exe', 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll', 'Install.cmd', 'install-user.ps1', 'data'
          $missing = $need | Where-Object { -not (Test-Path "dist/Tidewater/$_") }
          if ($missing) { throw "Missing: $($missing -join ', ')" }
      - uses: actions/upload-artifact@v4
        with:
          name: Tidewater-portable
          path: dist/Tidewater
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: portable
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Tidewater-portable
          path: Tidewater
      - run: zip -r Tidewater-portable.zip Tidewater
      - uses: softprops/action-gh-release@v2
        with:
          files: Tidewater-portable.zip
