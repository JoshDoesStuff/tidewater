# Builds the portable Windows zip (tool/release/build_portable.ps1) on a Windows runner.
# Every run uploads the Tidewater-portable (folder) and Tidewater-exe (one-exe launcher) artifacts;
# a v* tag also attaches Tidewater-portable.zip and Tidewater.exe to a Release:
#   curl -LO https://github.com/JoshDoesStuff/tidewater/releases/latest/download/Tidewater-portable.zip
name: Windows portable

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  portable:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Rust (smtc_windows)
        run: rustup toolchain install stable --profile minimal
      - name: Build portable folder
        run: ./tool/release/build_portable.ps1
      - name: Check contents
        run: |
          Get-ChildItem dist/Tidewater | Format-Table Name, Length
          $need = 'tidewater.exe', 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll', 'Install.cmd', 'install-user.ps1', 'data'
          $missing = $need | Where-Object { -not (Test-Path "dist/Tidewater/$_") }
          if ($missing) { throw "Missing: $($missing -join ', ')" }
      - uses: actions/upload-artifact@v4
        with:
          name: Tidewater-portable
          path: dist/Tidewater
          retention-days: 30
      - name: Pack one-exe build
        run: ./tool/release/pack_launcher.ps1
      - name: One-exe smoke test (unpack only)
        timeout-minutes: 5
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -Last 1
          $deps = & $dumpbin.FullName /dependents build/launcher/Release/tidewater_launcher.exe | Out-String
          Write-Host $deps
          if ($deps -match 'vcruntime|msvcp') { throw 'The launcher needs the MSVC runtime (it must be built with /MT)' }
          $env:TIDEWATER_UNPACK_ONLY = '1'
          $p = Start-Process (Resolve-Path dist/Tidewater.exe).Path -Wait -PassThru
          if ($p.ExitCode) { throw "Unpack failed (exit $($p.ExitCode))" }
          $dir = Get-ChildItem "$env:LOCALAPPDATA\Tidewater\versions" -Directory | Select-Object -First 1
          $want = @(Get-ChildItem dist/Tidewater -Recurse -File | Where-Object { $_.Name -notin 'Install.cmd', 'install-user.ps1' }).Count + 1
          $got = @(Get-ChildItem $dir.FullName -Recurse -File -Force).Count
          Write-Host "Unpacked to $($dir.FullName): $got files (want $want, counting .complete)"
          if (-not (Test-Path "$($dir.FullName)\tidewater.exe") -or $got -ne $want) { throw 'The unpacked folder is incomplete' }
      - uses: actions/upload-artifact@v4
        with:
          name: Tidewater-exe
          path: dist/Tidewater.exe
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: portable
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Tidewater-portable
          path: Tidewater
      - uses: actions/download-artifact@v4
        with:
          name: Tidewater-exe
      - run: zip -r Tidewater-portable.zip Tidewater
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Tidewater-portable.zip
            Tidewater.exe
